[project]
name = "rig"
version = "0.1.0"
description = "Define a multi-agent harness in YAML, then run it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
rig = "rig.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Spread the tests over worker processes (pytest-xdist); `-n 0` runs them in one process.
# Twice the CPU cores: most tests wait on git or other subprocesses, not on the CPU. worksteal
# moves queued tests to idle workers, so a few slow ones don't hold the end of the run.
addopts = "-n auto --dist worksteal"  # auto: see pytest_xdist_auto_num_workers in tests/conftest.py
