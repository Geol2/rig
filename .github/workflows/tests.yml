name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # Windows too: rig is used there, and path handling differs (drives, backslashes, CRLF).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest -q
